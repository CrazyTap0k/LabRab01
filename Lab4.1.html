<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Гребенюк Іван">
    <title>Лабораторна робота №4.1</title>
</head>

<body style="background-color: #eeeeee;">

<h1 align="center">Горизонтальні рядки, що біжать</h1>

<marquee behavior="alternate"
         bgcolor="#99ff99"
         height="50">
    <font color="darkgreen" face="Arial" size="5">
        Рядок коливається з боку в бік
    </font>
</marquee>

<br><br>

<marquee direction="left"
         behavior="scroll"
         bgcolor="#99ccff"
         height="50">
    <font color="blue" face="Verdana" size="5">
        Цей рядок рухається справа наліво
    </font>
</marquee>

<br><br>

<marquee direction="right"
         behavior="slide"
         bgcolor="#ffcc99"
         height="50">
    <font color="brown" face="Tahoma" size="5">
        Цей рядок рухається зліва направо та зупиняється
    </font>
</marquee>

<br><br>

<marquee direction="left"
         behavior="scroll"
         scrolldelay="50"
         bgcolor="#ff99cc"
         height="50">
    <font color="purple" face="Arial" size="5">
        Швидкий рядок із затримкою 50 мс
    </font>
</marquee>

<br><br>

<marquee direction="left"
         behavior="scroll"
         scrolldelay="200"
         bgcolor="#ffff99"
         height="50">
    <font color="red" face="Georgia" size="5">
        Повільний рядок із затримкою 200 мс
    </font>
</marquee>

</body>
</html>
