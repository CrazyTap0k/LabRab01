<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Гребенюк Іван">
    <title>Лабораторна робота №4.2</title>
</head>

<body style="background-color: #eeeeee;">

<h1 align="center">Вертикальні рядки, що біжать</h1>

<marquee direction="up"
         behavior="alternate"
         bgcolor="#99ff99"
         width="300"
         height="200">
    <center>
        <font color="darkgreen" face="Arial" size="5">
            Текст коливається вгору та вниз
        </font>
        <br>
        <img src="https://via.placeholder.com/80" alt="Рисунок">
    </center>
</marquee>

<br><br>

<marquee direction="up"
         behavior="scroll"
         bgcolor="#99ccff"
         width="300"
         height="200">
    <center>
        <img src="https://via.placeholder.com/70" alt="Рисунок 1"><br>
        <img src="https://via.placeholder.com/70" alt="Рисунок 2"><br>
        <img src="https://via.placeholder.com/70" alt="Рисунок 3">
    </center>
</marquee>

<br><br>

<marquee direction="down"
         behavior="slide"
         bgcolor="#ffcc99"
         width="300"
         height="200">
    <center>
        <img src="https://via.placeholder.com/70" alt="Рисунок 1"><br>
        <img src="https://via.placeholder.com/70" alt="Рисунок 2">
    </center>
</marquee>

<br><br>

<marquee direction="up"
         behavior="scroll"
         scrolldelay="50"
         bgcolor="#ff99cc"
         width="300"
         height="200">
    <center>
        <font color="purple" size="5">
            Швидкий вертикальний рядок
        </font>
    </center>
</marquee>

<br><br>

<marquee direction="up"
         behavior="scroll"
         scrolldelay="200"
         bgcolor="#ffff99"
         width="300"
         height="200">
    <center>
        <font color="red" size="5">
            Повільний вертикальний рядок
        </font>
    </center>
</marquee>

</body>
</html>
